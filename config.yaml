# =============================================================================
# Goodput-Evaluation Runtime for Early-Exit ViT (ViT-B/16 + LPH, 2-stage batching)
# Target HW: single NVIDIA RTX 5090, ONNX Runtime CUDA Execution Provider.
# All knobs live here. Paths marked (FILL IN) must be set for your server.
# =============================================================================

data:
  # Path to ImageNet val on the server (ImageFolder layout: val/<class>/*.JPEG)
  imagenet_val_dir: "/home2/imagenet/val"      # (FILL IN if different)
  num_requests: 16384                            # N requests drawn from val
  image_size: 224
  # timm standard preprocessing (vit_base_patch16_224): resize 256 -> center-crop 224
  resize: 256
  crop: 224
  mean: [0.5, 0.5, 0.5]                         # timm ViT default (inception-style)
  std:  [0.5, 0.5, 0.5]
  interpolation: "bicubic"

model:
  best_ckpt_path: "checkpoints/best.pth"        # trained EE-ViT-B/16 LPH checkpoint
  num_classes: 1000
  hidden_dim: 768
  exit_after_block: 6                            # LPH attached after 6th encoder block
  timm_model: "vit_base_patch16_224"            # used by `plain` (ImageNet pretrained)

early_exit:
  confidence_threshold: 0.7                      # max-softmax >= threshold -> exit at seg1
                                                 # fixed across the SLO sweep

batching:
  seg1_batch: 16                                 # seg1 accumulation batch (all runtimes)
  seg2_batch: 16                                 # proposed seg2 flush size (single-run default)
  seg2_batch_sweep: [4, 8, 16, 32]            # plot 1: one curve per seg2 batch size
  # proposed seg2 flush mode:
  #   "fixed": queue >= seg2_batch -> flush exactly seg2_batch (static ONNX graph)
  #   "all"  : queue >= seg2_batch -> flush the ENTIRE queue (dynamic ONNX graph,
  #            like naive; seg2 timed per flush since size varies)
  seg2_flush_mode: "fixed"

arrivals:
  # Manual per-runtime operating points, used ONLY by plot11b
  # (plot11b_latency_cdf_per_runtime_lambda). plot2/3/3b/7/7b derive their own
  # λ from each config's measured capacity × capacity_margin_frac
  # (gate/plots.py:_capacity_step_lambda) and ignore this block; plot11a uses
  # the single shared plots.cdf_common_lambda instead.
  # Per runtime: a rate in req/s, 0 = saturated (all arrivals at t=0, latency
  # measured from the stage-1 op start), null = fall back to that runtime's
  # capacity×margin λ. Remove the whole `lambda:` key to skip plot11b.
  # Each runtime's λ is printed and written into its legend entry, since the
  # curves are NOT iso-load — that is what plot11a is for; read them as a pair.
  lambda:
    plain: 1590
    naive: 1650
    proposed: 1650
  # The λ-sweep plots (load vs latency, breakdown) always use lambda_sweep below.
  # Load plot sweep (requests/sec). Adjust to your GPU's throughput.
  lambda_sweep:
    start: 100
    stop: 2000.0
    step: 5.0
  seed: 1234                                     # fixes arrival trace + request sampling

slo:
  # Latency SLO sweep for goodput plot (milliseconds)
  start_ms: 0
  stop_ms: 100
  step_ms: 1

metrics:
  # Goodput definition:
  #   "wallclock"       : (# good samples) / (wall-clock span)          [spec §6, default]
  #   "mean_throughput" : (1/N) * sum over good samples of (1/latency)
  goodput_mode: "wallclock"

runtime:
  warmup_iters: 20                               # CUDA warmup runs per graph (excluded from timing)
  measure_iters: 1                               # measured repeats per (segment,batch) service-time probe
  providers: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  # ORT session options
  graph_optimization_level: "ORT_ENABLE_ALL"
  intra_op_num_threads: 0                        # 0 = ORT default
  # Cache measured (segment,batch)->service_time to avoid re-timing static graphs.
  # naive seg2 is ALWAYS measured per-batch (dynamic count) regardless of this flag.
  cache_static_service_times: true

paths:
  onnx_dir: "artifacts/onnx"                     # exported + cached ONNX graphs
  plots_dir: "artifacts/plots"                   # output figures
  results_dir: "artifacts/results"               # raw per-sample records (npz/json)
  # Writable HuggingFace/timm cache (avoids Permission denied on shared caches).
  # Leave as-is unless you already have a writable HF_HOME you prefer.
  hf_cache: "artifacts/hf_cache"

plots:
  dpi: 300                                       # PNG raster dpi (PDF is vector)
  format: "png"
  # Display names for the three runtimes, used in EVERY figure's legend /
  # title / axis ticks (gate/plot_style.py:RUNTIME_LABELS, applied once via
  # `configure(cfg)` at the top of plot_all / e2e_table.generate). Does NOT
  # cover the proposed seg2_batch sweep's own labels (e.g. "$bs_2=16$",
  # gate/plot_style.py:b2_label) — those appear inside figures that already
  # name GATE/proposed elsewhere (title or a plain legend entry), so the
  # bs2 tag alone is enough there.
  runtime_labels:
    plain: "Plain"
    naive: "Naive"
    proposed: "GATE"
  # Timeline plot (plot7): clip the x-axis to the first N ms (null = full run).
  timeline_xlim_ms: null
  # Plot 1 pair figures: BOTH figures show plain + naive + the proposed b2
  # sweep; the keys below only pick each figure's operating point λ, applied to
  # ALL runtimes in that figure (identical arrival trace). DEFAULT = AUTO,
  # derived from measured capacities to match e2e Table B: each figure at its
  # OWN anchor's last stable load — plot1a at D_plain − step, plot1b at
  # D_naive − step.
  # Uncomment to override manually (number = fixed rate, 0 = saturated).
  # NOTE: manual values here also produce e2e Table C at those λ.
  # slo_goodput_lambda:
  #   plain: 1600                                # plot1a: λ anchored on plain
  #   naive: 1690                                # plot1b: λ anchored on naive
  #   proposed: 1720                             # plot1c: λ anchored on proposed
  # plot1c anchors on `proposed`, which is a seg2_batch SWEEP, so one variant has
  # to be picked to read a capacity off:
  #   "max_capacity" (default) -> the b2 that sustains the highest load, i.e.
  #                               the true right edge of the whole design space
  #   "config"                 -> batching.seg2_batch
  #   a number                 -> that b2 (must be in seg2_batch_sweep)
  # Every b2's measured capacity is printed either way — state the chosen one in
  # the caption, since the figure's λ is only meaningful next to it.
  slo_goodput_b2: "max_capacity"
  # Latency KDE (plot2/plot2b): bandwidth as a fraction of the data std
  # (scipy bw_method). Larger = smoother, smaller = spikier; null = Scott rule.
  kde_bandwidth: 0.3
  kde_grid_points: 400                           # x-resolution of the KDE curve
  # KDE x-axis upper bound — lower these when a long tail (e.g. proposed at
  # b2=32) squeezes the bulk of the distribution to the left:
  #   kde_xlim_ms: fixed cutoff in ms (takes precedence; null = disabled)
  #   kde_clip_percentile: percentile of plotted latencies (99.5 = old behavior)
  # If clipped, state "tail truncated at X ms" in the figure caption.
  kde_xlim_ms: null
  kde_clip_percentile: 99
  # plot2b's per-panel λ anchor: each config (plain/naive/every bs2) is
  # replayed at its OWN operating point, but which one:
  #   "knee"     -> min-mean-latency sweet spot (Table D; default — shows
  #                 each config's best-case latency shape)
  #   "capacity" -> capacity × capacity_margin_frac (same as plot2/3/3b/7/7b)
  #                 — shows each config pushed near its throughput ceiling
  #                 instead, so tails will be much heavier.
  kde_sweep_anchor: "capacity"
  # Safety margin for the distribution-shape figures (plot2/2b/3/3b/7/7b
  # ONLY — plot1a/1b and Table B/E deliberately keep the tighter
  # capacity−step convention, see gate/plots.py:_capacity_step_lambda).
  # A fixed 1-sweep-step margin (~0.3% of capacity) was too thin: plain's
  # latency showed near-critical (ρ→1) burstiness (bimodal KDE) right at
  # capacity−step. 0.90 matches Nexus (SOSP'19), which evaluates Poisson
  # load at 90% of max throughput for the same reason.
  capacity_margin_frac: 0.90
  # Plot 11 (iso-load latency CDF): ONE λ shared by plain / naive / proposed@
  # seg2_batch, so the curves differ only by batching structure — plot3 gives
  # each runtime its own capacity×margin λ, which mixes in the load difference
  # (proposed sustains ~11% more req/s, so plot3 measures it at a higher load).
  # NEVER auto-derived: pick a rate every compared runtime can sustain, i.e.
  # below the SMALLEST capacity in Table A (plain's, ~1608 req/s here) with some
  # margin — 1445 = plain capacity × 0.90. State this λ in the caption.
  #   null -> figure skipped;  0 -> saturated (latency from stage-1 input)
  cdf_common_lambda: 1630
  # Plot 12a/12b (latency histograms — KDE-free view of plot11 / plot3):
  #   hist_bins    : number of shared bins over [min, kde x-clip] (default 80)
  #   hist_density : true -> normalized density, false -> raw counts (default)
  # x-range reuses kde_xlim_ms / kde_clip_percentile above. 12a needs
  # cdf_common_lambda set (else skipped, like plot11); 12b always renders.
  hist_bins: 80
  hist_density: false
  # Plot 13a–13d — ONE early-exit runtime per figure, latency split by
  # per-sample exit class (purple = exits at stage 1, red = also runs stage 2):
  #   13a/13b naive     KDE / histogram
  #   13c/13d proposed@seg2_batch  KDE / histogram
  # These explain why the pooled curves in plot2/12b show little bimodality:
  # both classes share the formation + queue wait, which carries almost all of
  # the variance, so the conditionals are one distribution shifted by the
  # non-exit class's extra stage-2 cost — only ~2-3 ms for naive (its seg2 runs
  # right after its own seg1), larger and more variable for proposed (seg2
  # queue wait until seg2_batch fills + a full static seg2). Separation stats
  # (mean gap, pooled sd, Cohen's d) are printed to stdout — quote them in the
  # caption. All four share these keys:
  #   exit_split_lambda      : null/"auto" -> each runtime's OWN capacity×margin
  #                            λ (the plot2/3/12b operating point, so the pooled
  #                            curve matches that runtime's curve there);
  #                            number -> fixed rate;  0 -> saturated.
  #                            May also be a per-runtime mapping, e.g.
  #                            {naive: null, proposed: 1445}.
  #                            0 is the only setting that actually SPLITS the
  #                            modes (latency is then measured from the stage-1
  #                            op start, which removes the shared formation +
  #                            queue wait: naive's d jumps 0.7 -> 4.6). Use it
  #                            for a "the two populations do exist" figure; keep
  #                            null for the honest end-to-end view.
  #   exit_split_normalize   : "mixture" -> class KDEs scaled by their sample
  #                            share, so they sum to the pooled density (shown
  #                            in gray); "each" -> each normalized to unit area
  #   exit_split_show_pooled : draw the pooled KDE as a gray reference
  #                            (only meaningful with "mixture")
  #   exit_split_hist_stacked: 13b/13d stack the two disjoint classes (sums to
  #                            the pooled histogram); false -> overlaid
  # Bandwidth / bins / x-range are inherited from kde_* and hist_bins above.
  # Plot 13e/13f — the 13b/13d histogram with every bar cut by WHERE its
  # samples spent their time: bar height is still the bin count, the colors are
  # that bin's mean latency composition (formation wait / GPU wait / stage-1 /
  # stage-2 queue wait / stage-2 compute, same palette as plot5/6). Two panels
  # per figure: exit | non-exit. naive's stage-2 queue wait band is absent by
  # construction. Skipped when exit_split_lambda is saturated (the components
  # are arrival-referenced and would not sum to the plotted latency).
  #   composition_bins: coarser than hist_bins on purpose — 80 thin bars cut
  #                     into five colors is unreadable at print size.
  composition_bins: 40
  # Plot 14a-14g — 13a-13d again, but pinned to ONE shared λ and annotated
  # with the SLO deadline, so naive (14a/14b/14e) and proposed (14c/14d/14f)
  # are directly comparable: same offered load, only the batching structure
  # differs. 13's per-runtime capacity×margin λ cannot support that
  # comparison. 14g is 14e+14f as one 4-panel figure.
  #   exit_split_common_lambda: the shared rate in req/s.
  #     "auto" (default) -> naive's capacity minus one λ-sweep step, snapped
  #       to the grid — the SAME "last stable load" formula e2e_table.py's
  #       Table B uses for naive's own reference λ (λ2), computed on the
  #       plain/naive/proposed@seg2_batch common set. Table F reports the
  #       exact mean/p99 latency this λ produces, split by exit class.
  #     number -> fixed manual override; 0 = saturated.
  #     null -> all seven figures (14a-14g) are skipped.
  #   exit_split_slo_ms: a number, or a list of numbers, drawn as red vertical
  #     deadline line(s). null = no line. The per-class violation rates at each
  #     SLO are printed to stdout — that is the number the figure argues about.
  #   exit_split_xlim_ms: FIXED upper x-bound (ms), not the percentile clip
  #     plot13 uses. All four panels must share one scale to be comparable, and
  #     the tail past the SLO is exactly what is being argued about, so a p99
  #     cut would hide the evidence. Anything still beyond it is reported on
  #     stdout. null -> fall back to plot13's kde_clip_percentile behavior.
  exit_split_common_lambda: "auto"
  exit_split_slo_ms: 50
  exit_split_xlim_ms: 100
  exit_split_lambda: null
  exit_split_normalize: "mixture"
  exit_split_show_pooled: true
  exit_split_hist_stacked: true
  # Plot 1d (peak_goodput.{json,csv} / plot1d_peak_goodput_bars): SLO sweep for
  # the peak-goodput scan (plain/naive/every bs2, each at its OWN goodput-
  # maximizing λ over the whole lambda_sweep grid). FIXED and explicit, unlike
  # Table B's slo_avg/slo_p99 (which are DERIVED from plain's mean/p99 response
  # time at λ1 and drift if the measured service times change run to run).
  # null -> fall back to the old derived behavior (slo_avg..slo_p99, step 10).
  peak_goodput_slo:
    start_ms: 40
    stop_ms: 100
    step_ms: 10
